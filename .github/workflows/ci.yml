name: CI

on:
  push:
    branches: [main, codex/stabilize-core]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development extras
        run: python -m pip install -e ".[desktop,mcp,dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: CLI startup smoke test
        shell: bash
        run: printf '/sair\n' | python -m noite --cli
